<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meals — Health Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="page-content">
      <div class="container">
        <header class="page-header">
          <h1>Meals</h1>
          <p>Log and manage your daily nutrition.</p>
        </header>

        <p id="alert" class="alert" hidden role="alert"></p>

        <section class="panel">
          <h2>Log a meal</h2>
          <form id="meal-form">
            <p class="form-group">
              <label for="meal-name">Meal name</label>
              <input id="meal-name" required placeholder="e.g. Grilled chicken salad" />
            </p>
            <section class="form-row">
              <p class="form-group">
                <label for="meal-calories">Calories</label>
                <input id="meal-calories" type="number" min="0" max="10000" required />
              </p>
              <p class="form-group">
                <label for="meal-date">Date</label>
                <input id="meal-date" type="date" required />
              </p>
            </section>
            <details class="macro-details">
              <summary class="macro-summary">Add macros <span class="macro-summary-hint">(optional)</span></summary>
              <section class="form-row form-row-3">
                <p class="form-group">
                  <label for="meal-protein">Protein (g)</label>
                  <input id="meal-protein" type="number" min="0" max="500" placeholder="0" />
                </p>
                <p class="form-group">
                  <label for="meal-carbs">Carbs (g)</label>
                  <input id="meal-carbs" type="number" min="0" max="1000" placeholder="0" />
                </p>
                <p class="form-group">
                  <label for="meal-fat">Fat (g)</label>
                  <input id="meal-fat" type="number" min="0" max="500" placeholder="0" />
                </p>
              </section>
            </details>
            <button type="submit" class="btn btn-secondary">Add meal</button>
          </form>
        </section>

        <section class="panel">
          <h2>Meal history</h2>
          <section id="meal-list" class="list"></section>
        </section>
      </div>
    </main>

    <!-- Edit Meal Modal -->
    <div id="edit-modal" class="modal-overlay" hidden aria-modal="true" role="dialog">
      <div class="modal">
        <h2 class="modal-title">Edit meal</h2>
        <form id="edit-meal-form">
          <p class="form-group">
            <label for="edit-meal-name">Meal name</label>
            <input id="edit-meal-name" required />
          </p>
          <section class="form-row">
            <p class="form-group">
              <label for="edit-meal-calories">Calories</label>
              <input id="edit-meal-calories" type="number" min="0" max="10000" required />
            </p>
            <p class="form-group">
              <label for="edit-meal-date">Date</label>
              <input id="edit-meal-date" type="date" required />
            </p>
          </section>
          <section class="form-row form-row-3">
            <p class="form-group">
              <label for="edit-meal-protein">Protein (g)</label>
              <input id="edit-meal-protein" type="number" min="0" max="500" placeholder="—" />
            </p>
            <p class="form-group">
              <label for="edit-meal-carbs">Carbs (g)</label>
              <input id="edit-meal-carbs" type="number" min="0" max="1000" placeholder="—" />
            </p>
            <p class="form-group">
              <label for="edit-meal-fat">Fat (g)</label>
              <input id="edit-meal-fat" type="number" min="0" max="500" placeholder="—" />
            </p>
          </section>
        </form>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="button" id="modal-save" class="btn btn-secondary">Save changes</button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/meals.js"></script>
  </body>
</html>
