<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — Health Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="page-content">
      <div class="container">
        <header class="page-header">
          <h1>Profile</h1>
          <p>Manage your account and preferences.</p>
        </header>

        <p id="alert" class="alert" hidden role="alert"></p>

        <section class="panel">
          <h2>Account</h2>
          <p class="form-group">
            <label>Email</label>
            <span id="profile-email" style="color: var(--text);">—</span>
          </p>
          <p class="form-group">
            <label>Member since</label>
            <span id="profile-since" style="color: var(--text);">—</span>
          </p>
        </section>

        <section class="panel">
          <h2>Daily calorie goal</h2>
          <p style="color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem;">
            Set a daily calorie target. The dashboard progress bar tracks your intake against this goal.
          </p>
          <div class="form-row" style="max-width: 420px; align-items: flex-end;">
            <p class="form-group" style="margin: 0;">
              <label for="goal-input">Target calories (kcal)</label>
              <input id="goal-input" type="number" min="500" max="10000" placeholder="e.g. 2000" />
            </p>
            <p class="form-group" style="margin: 0;">
              <button type="button" id="save-goal-btn" class="btn btn-secondary" style="width: 100%;">Save goal</button>
            </p>
          </div>
        </section>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
