<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard â€” APEX</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>âš¡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  </head>
  <body class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="page-content">
      <div class="container">

        <p id="alert" class="alert" hidden role="alert"></p>

        <!-- Personalized greeting -->
        <header class="dash-greeting">
          <h1 id="greeting-title">Welcome back.</h1>
          <p id="greeting-sub" class="greeting-sub"></p>
        </header>

        <!-- 3 stat cards -->
        <section class="stats-row">
          <article class="stat-card">
            <div class="stat-header-row">
              <h3>Daily Calories</h3>
              <button type="button" id="set-goal-btn" class="btn-link">Edit goal</button>
            </div>
            <p>
              <span id="today-calories">0</span>
              <span class="stat-goal"> / <span id="calorie-goal-display">2000</span> kcal</span>
            </p>
            <div class="progress-track">
              <div id="calorie-progress-bar" class="progress-fill"></div>
            </div>
          </article>

          <article class="stat-card workout-stat">
            <h3>Workout Time</h3>
            <p><span id="today-minutes">0</span> <span class="stat-unit">min</span></p>
          </article>

          <article class="stat-card weight-stat">
            <h3>Current Weight</h3>
            <p><span id="latest-weight">â€”</span> <span class="stat-unit">kg</span></p>
          </article>
        </section>

        <!-- Charts -->
        <div class="grid-2">
          <section class="panel">
            <h2>7-Day History</h2>
            <div class="chart-wrap">
              <canvas id="weekly-chart" aria-label="Weekly calories and workout minutes"></canvas>
            </div>
          </section>

          <section class="panel" id="macro-donut-panel" hidden>
            <h2>Macro Distribution</h2>
            <div class="donut-wrap">
              <canvas id="macro-donut" aria-label="Today's macro distribution"></canvas>
            </div>
            <div class="donut-legend" id="donut-legend"></div>
          </section>
        </div>

        <!-- Recent Activity -->
        <section class="panel">
          <h2>Recent Activity</h2>
          <div id="activity-list" class="activity-list">
            <p class="empty">No recent activity yet.</p>
          </div>
        </section>

      </div>
    </main>

    <!-- Goal Modal -->
    <div id="goal-modal" class="modal-overlay" hidden aria-modal="true" role="dialog">
      <div class="modal modal-sm">
        <h2 class="modal-title">Set daily calorie goal</h2>
        <p class="form-group">
          <label for="goal-input">Daily calorie goal (kcal)</label>
          <input id="goal-input" type="number" min="500" max="10000" placeholder="e.g. 2000" />
        </p>
        <div class="modal-actions">
          <button type="button" id="goal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="button" id="goal-save" class="btn btn-secondary">Save</button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
