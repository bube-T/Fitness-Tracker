<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Health Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  </head>
  <body class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="page-content">
      <div class="container">
        <header class="page-header">
          <h1>Dashboard</h1>
          <p>Your nutrition and fitness at a glance.</p>
        </header>

        <p id="alert" class="alert" hidden role="alert"></p>

        <section class="stats-row">
          <article class="stat-card">
            <div class="stat-header-row">
              <h3>Today&apos;s calories</h3>
              <button type="button" id="set-goal-btn" class="btn-link">Edit goal</button>
            </div>
            <p>
              <span id="today-calories">0</span>
              <span class="stat-goal"> / <span id="calorie-goal-display">2000</span> kcal</span>
            </p>
            <div class="progress-track">
              <div id="calorie-progress-bar" class="progress-fill"></div>
            </div>
          </article>

          <article class="stat-card workout-stat">
            <h3>Today&apos;s workout</h3>
            <p><span id="today-minutes">0</span> min</p>
          </article>
        </section>

        <section class="panel">
          <h2>Last 7 days</h2>
          <section class="chart-wrap">
            <canvas id="weekly-chart" aria-label="Weekly calories and workout minutes"></canvas>
          </section>
        </section>

        <section class="quick-links">
          <a href="meals.html" class="quick-link-card">
            <strong>Log a meal</strong>
            <span>Track your nutrition intake</span>
          </a>
          <a href="workouts.html" class="quick-link-card">
            <strong>Log a workout</strong>
            <span>Track your activity and progress</span>
          </a>
          <a href="profile.html" class="quick-link-card">
            <strong>Settings</strong>
            <span>Adjust your calorie goal</span>
          </a>
        </section>
      </div>
    </main>

    <!-- Goal Modal -->
    <div id="goal-modal" class="modal-overlay" hidden aria-modal="true" role="dialog">
      <div class="modal modal-sm">
        <h2 class="modal-title">Set daily calorie goal</h2>
        <p class="form-group">
          <label for="goal-input">Daily calorie goal (kcal)</label>
          <input id="goal-input" type="number" min="500" max="10000" placeholder="e.g. 2000" />
        </p>
        <div class="modal-actions">
          <button type="button" id="goal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="button" id="goal-save" class="btn btn-secondary">Save</button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
