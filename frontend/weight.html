<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight â€” APEX</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>âš¡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  </head>
  <body class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="page-content">
      <div class="container">
        <header class="page-header">
          <h1>Weight</h1>
          <p>Track your weight over time.</p>
        </header>

        <p id="alert" class="alert" hidden role="alert"></p>

        <!-- Weight stats summary -->
        <div class="weight-stats-grid" id="weight-stats-grid" hidden>
          <div class="weight-stat-mini">
            <h4>Current</h4>
            <p><span id="ws-current">â€”</span><span class="ws-unit"> kg</span></p>
          </div>
          <div class="weight-stat-mini">
            <h4>Lowest</h4>
            <p><span id="ws-lowest">â€”</span><span class="ws-unit"> kg</span></p>
          </div>
          <div class="weight-stat-mini">
            <h4>Highest</h4>
            <p><span id="ws-highest">â€”</span><span class="ws-unit"> kg</span></p>
          </div>
          <div class="weight-stat-mini">
            <h4>30-day change</h4>
            <p><span id="ws-change">â€”</span><span class="ws-unit"> kg</span></p>
          </div>
        </div>

        <section class="panel">
          <h2>Log weight</h2>
          <form id="weight-form">
            <section class="form-row" style="max-width: 420px;">
              <p class="form-group">
                <label for="weight-value">Weight (kg)</label>
                <input id="weight-value" type="number" min="1" max="500" step="0.1" required placeholder="e.g. 72.5" />
              </p>
              <p class="form-group">
                <label for="weight-date">Date</label>
                <input id="weight-date" type="date" required />
              </p>
            </section>
            <button type="submit" class="btn btn-secondary">Log weight</button>
          </form>
        </section>

        <section class="panel" id="chart-panel" hidden>
          <h2>Trend</h2>
          <section class="chart-wrap">
            <canvas id="weight-chart" aria-label="Weight trend over time"></canvas>
          </section>
        </section>

        <section class="panel">
          <h2>History</h2>
          <section id="weight-list" class="list"></section>
        </section>
      </div>
    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay" hidden aria-modal="true" role="dialog">
      <div class="modal modal-sm">
        <h2 class="modal-title">Edit entry</h2>
        <form id="edit-weight-form">
          <section class="form-row">
            <p class="form-group">
              <label for="edit-weight-value">Weight (kg)</label>
              <input id="edit-weight-value" type="number" min="1" max="500" step="0.1" required />
            </p>
            <p class="form-group">
              <label for="edit-weight-date">Date</label>
              <input id="edit-weight-date" type="date" required />
            </p>
          </section>
        </form>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="button" id="modal-save" class="btn btn-secondary">Save changes</button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/weight.js"></script>
  </body>
</html>
